receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: backplane
          scrape_interval: 15s
          static_configs:
            - targets: ['127.0.0.1:3000']
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [debug]
